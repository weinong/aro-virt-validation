additionalTrustBundlePolicy: Proxyonly
apiVersion: v1
baseDomain: %baseDomain%
compute:
- architecture: amd64
  hyperthreading: Enabled
  name: worker
  platform:
    azure:
      type: Standard_D4s_v6
  replicas: 1
controlPlane:
  architecture: amd64
  hyperthreading: Enabled
  name: master
  platform:
    azure:
      type: Standard_D8s_v6
      zones:
      - "1"
      - "3"
  replicas: 3
metadata:
  name: %clustername%
networking:
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  machineNetwork:
  - cidr: 10.0.0.0/16
  networkType: OVNKubernetes
  serviceNetwork:
  - 172.30.0.0/16
platform:
  azure:
    baseDomainResourceGroupName: %baseDomainResourceGroupName%
    cloudName: AzurePublicCloud
    outboundType: Loadbalancer
    region: %region%
    userTags:
      createdBy: user
      environment: dev
publish: External
pullSecret: '%pullsecret%'
sshKey: |
  %sshkey%
